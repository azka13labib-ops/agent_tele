services:
  hermes-bot:
    build: .
    container_name: hermes-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    # Host networking allows the container to talk directly to Tailscale IPs (100.x.y.z)
    network_mode: host
    volumes:
      - ./knowledge:/app/knowledge
      - ./sessions:/app/sessions
